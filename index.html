<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESHOT | DOMAIN INDEX</title>
    <style>
        :root { --p: #00ff88; --b: #050505; --c: #111; --t: #eee; }
        body { background: var(--b); color: var(--t); font-family: sans-serif; margin: 0; padding: 20px; }
        .wrap { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 40px 0; }
        h1 { font-size: 5rem; font-weight: 900; margin: 0; color: var(--p); letter-spacing: -3px; }
        .bar { position: sticky; top: 20px; z-index: 9; background: var(--b); padding: 10px 0; }
        input { width: 100%; padding: 25px; font-size: 1.5rem; background: var(--c); border: 2px solid #222; border-radius: 12px; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--p); }
        .tags { display: flex; gap: 8px; margin: 20px 0; justify-content: center; }
        .tag { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .tag.on { background: var(--p); color: #000; border-color: var(--p); }
        .item { background: var(--c); margin-bottom: 8px; padding: 20px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #222; }
        .name { font-size: 1.2rem; font-weight: bold; }
        .price { font-size: 1.5rem; color: var(--p); font-weight: 800; }
        .buy { background: #fff; color: #000; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 900; margin-left: 15px; }
    </style>
</head>
<body>
    <div class="wrap">
        <header><h1>ESHOT</h1></header>
        <div class="bar">
            <input type="text" id="q" placeholder="ENTER NAME..." autocomplete="off">
            <div class="tags">
                <div class="tag on" onclick="st('all', this)">ALL</div>
                <div class="tag" onclick="st('cheap', this)">UNDER $15</div>
                <div class="tag" onclick="st('tech', this)">TECH</div>
            </div>
        </div>
        <div id="r"></div>
    </div>
    <script>
        const db = {
            "com": { p: 9.15, r: "Cloudflare", cat: "all" },
            "net": { p: 11.01, r: "Porkbun", cat: "all" },
            "org": { p: 12.50, r: "Namecheap", cat: "all" },
            "io": { p: 32.50, r: "Porkbun", cat: "tech" },
            "ai": { p: 65.00, r: "Namecheap", cat: "tech" },
            "xyz": { p: 1.99, r: "Porkbun", cat: "cheap" }
        };
        let f = 'all';
        function st(v, e) {
            f = v;
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('on'));
            e.classList.add('on');
            search();
        }
        async function search() {
            const v = document.getElementById('q').value.trim().toLowerCase().split('.')[0];
            if (v.length < 2) return;
            let h = '';
            for (const [tld, i] of Object.entries(db)) {
                if (f === 'cheap' && i.p > 15) continue;
                if (f === 'tech' && i.cat !== 'tech') continue;
                const d = `${v}.${tld}`;
                const res = await fetch(`/api/check?d=${d}`);
                const data = await res.json();
                h += `<div class="item">
                    <div><div class="name">${d}</div><div style="color:${data.ok?'#0f8':'#f44'}">${data.ok?'AVAILABLE':'TAKEN'}</div></div>
                    <div style="display:flex;align-items:center"><div class="price">$${i.p}</div><a href="https://${i.r}.com" class="buy">BOOM</a></div>
                </div>`;
            }
            document.getElementById('r').innerHTML = h;
        }
        document.getElementById('q').addEventListener('input', search);
    </script>
</body>
</html>
