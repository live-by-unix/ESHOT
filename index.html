<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESHOT | DOMAIN INDEX</title>
    <style>
        :root { --p: #00ff88; --b: #050505; --c: #111; --t: #eee; }
        body { background: var(--b); color: var(--t); font-family: sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        .wrap { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 60px 0; }
        h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; margin: 0; color: var(--p); letter-spacing: -4px; line-height: 1; }
        .bar { position: sticky; top: 20px; z-index: 9; background: var(--b); padding: 10px 0; }
        input { width: 100%; padding: 25px; font-size: 1.5rem; background: var(--c); border: 2px solid #222; border-radius: 16px; color: #fff; box-sizing: border-box; outline: none; transition: 0.2s; font-weight: bold; }
        input:focus { border-color: var(--p); box-shadow: 0 0 30px rgba(0, 255, 136, 0.1); }
        .tags { display: flex; gap: 8px; margin: 20px 0; justify-content: center; }
        .tag { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .tag.on { background: var(--p); color: #000; border-color: var(--p); }
        .item { background: var(--c); margin-bottom: 10px; padding: 20px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #222; animation: in 0.3s ease forwards; }
        @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .name { font-size: 1.3rem; font-weight: 800; }
        .status { font-size: 0.7rem; letter-spacing: 1px; font-weight: bold; margin-top: 4px; }
        .price { font-size: 1.6rem; color: var(--p); font-weight: 900; text-align: right; }
        .buy { display: inline-block; background: #fff; color: #000; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 900; margin-left: 15px; font-size: 0.9rem; transition: 0.2s; }
        .buy:hover { background: var(--p); transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="wrap">
        <header><h1>ESHOT</h1><p style="letter-spacing:5px; opacity:0.5; font-size:0.7rem;">GLOBAL DOMAIN AGGREGATOR</p></header>
        <div class="bar">
            <input type="text" id="q" placeholder="ENTER DOMAIN NAME..." spellcheck="false" autocomplete="off">
            <div class="tags">
                <div class="tag on" onclick="st('all', this)">ALL</div>
                <div class="tag" onclick="st('cheap', this)">UNDER $15</div>
                <div class="tag" onclick="st('tech', this)">TECH</div>
            </div>
        </div>
        <div id="r"></div>
    </div>
    <script>
        const db = {
            "com": { p: 9.15, r: "Cloudflare", cat: "all" },
            "net": { p: 11.01, r: "Porkbun", cat: "all" },
            "org": { p: 12.50, r: "Namecheap", cat: "all" },
            "io": { p: 32.50, r: "Porkbun", cat: "tech" },
            "ai": { p: 65.00, r: "Namecheap", cat: "tech" },
            "app": { p: 14.00, r: "Google", cat: "tech" },
            "xyz": { p: 1.99, r: "Porkbun", cat: "cheap" },
            "me": { p: 4.50, r: "Namecheap", cat: "cheap" }
        };
        let filter = 'all';
        const q = document.getElementById('q');
        const r = document.getElementById('r');
        function st(f, el) {
            filter = f;
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('on'));
            el.classList.add('on');
            search();
        }
        async function search() {
            const val = q.value.trim().toLowerCase().split('.')[0];
            if (val.length < 2) { r.innerHTML = ''; return; }
            r.innerHTML = '<p style="text-align:center; opacity:0.5;">INDEXING...</p>';
            let h = '';
            for (const [tld, info] of Object.entries(db)) {
                if (filter === 'cheap' && info.p > 15) continue;
                if (filter === 'tech' && info.cat !== 'tech') continue;
                const d = `${val}.${tld}`;
                try {
                    const res = await fetch(`/api/check?d=${d}`);
                    const data = await res.json();
                    h += `<div class="item">
                            <div>
                                <div class="name">${d}</div>
                                <div class="status" style="color:${data.ok ? '#00ff88' : '#ff4444'}">${data.ok ? 'AVAILABLE' : 'TAKEN'}</div>
                            </div>
                            <div style="display:flex; align-items:center;">
                                <div class="price">$${info.p}</div>
                                <a href="https://${info.r.toLowerCase()}.com" target="_blank" class="buy">BOOM</a>
                            </div>
                        </div>`;
                } catch (e) {}
            }
            r.innerHTML = h;
        }
        let t;
        q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(search, 400); });
    </script>
</body>
</html>
